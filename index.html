<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ByteOn – Tecnologia que conecta você ao que importa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--lado:clamp(24px,5.8vw,112px);--tinta:#111;--navy:#0f172a;--cinza:#f3f3f3;--linha:#ddd;--oliva:#9a9a0a;--fonte:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:var(--fonte);font-weight:300;color:var(--tinta);line-height:1.5;font-size:18px}
a{color:inherit}h1,h2,h3{font-weight:300;line-height:1.15;margin:0 0 .5em}
.topo,.rodape,.secao,.estreito{max-width:1180px;margin:0 auto;padding:0 24px}
.topo{display:flex;justify-content:space-between;align-items:center;height:104px}
.logo{font-weight:700;font-size:28px;text-decoration:none;letter-spacing:-.5px}
nav{display:flex;align-items:center;gap:24px}nav a{text-decoration:none}nav a:hover{text-decoration:underline}
#btn-carrinho{position:relative;background:none;border:0;color:inherit;cursor:pointer;padding:0;display:inline-flex}
#badge{position:absolute;top:-10px;right:-12px;background:var(--tinta);color:#fff;border-radius:50%;width:22px;height:22px;font:700 12px/22px var(--fonte);text-align:center}
.avatar{display:inline-flex;margin-left:8px}
.heroi{background:var(--navy);color:#fff;text-align:center;padding:80px 24px}
.heroi h1{font-size:clamp(36px,6vw,64px);max-width:820px;margin:0 auto 24px}.heroi p{font-size:24px;max-width:780px;margin:0 auto 36px}
.btn{display:inline-block;background:var(--tinta);color:#fff;border:0;border-radius:999px;padding:16px 34px;font:400 17px var(--fonte);text-decoration:none;cursor:pointer;transition:transform .2s ease,background-color .2s ease}
.btn:hover{transform:translateY(-2px)}.btn.claro{background:#fff;color:var(--tinta);border:1px solid var(--tinta);border-radius:0}.btn.quad{border-radius:0}
.heroi .btn{background:#111;border:0}
.secao{padding:56px 24px}.secao h2{text-align:center;font-size:40px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
.card{text-align:center;position:relative}.card .foto{position:relative;display:block;background:#f6f6f6;overflow:hidden}
.card img{width:100%;display:block;aspect-ratio:1;object-fit:cover;transition:transform .35s}.card:hover img{transform:scale(1.05)}
.sel{position:absolute;top:6px;right:6px;border:1px solid var(--tinta);background:#fff;padding:6px 18px;font-size:20px;text-transform:uppercase;letter-spacing:.3px}
.sel.bola{border:0;background:var(--oliva);color:#fff;border-radius:50%;width:86px;height:86px;display:grid;place-items:center;text-transform:none;font-weight:700;padding:0}
.card h3{font-size:20px;margin:18px 0 6px}.card h3 a{text-decoration:none}
.preco{margin-bottom:14px}.preco s{opacity:.75;margin-right:6px}.preco b{font-weight:600}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;text-align:center}.tres h3{font-size:24px;font-weight:400}
.dep{border-left:2px solid var(--tinta);padding:6px 30px}.dep small{opacity:.8}
.centro{text-align:center}.centro p{font-size:24px}.centro .forte{font-weight:700}.pdesc{margin:6px 0 10px 28px;font-size:16px}
.estreito{max-width:780px;padding:64px 24px}.estreito h1{font-size:56px}.estreito p,.estreito li{margin:0 0 1em}.estreito h4{margin:1.4em 0 .3em;font-weight:600}
.largo{padding:24px var(--lado)}.trilha{font-size:16px;margin-bottom:24px}.trilha a{text-decoration:underline}
.barra{display:flex;justify-content:space-between;align-items:center;margin:16px 0 32px;flex-wrap:wrap;gap:12px}
select,input,textarea{font:400 16px var(--fonte);padding:14px;border:1px solid #bbb;width:100%;background:#fff}select{width:auto;padding:6px}
.produto{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}.produto img{width:100%}
.produto .preco{font-size:26px}.qtd{display:flex;gap:12px;align-items:center;margin:20px 0}.qtd input{width:90px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}.form label{display:block;font-size:20px;margin-bottom:6px}.form .tudo{grid-column:1/-1}.req{color:#b00}
.aviso{border:1px solid #2a7ab8;background:#eef6fc;padding:18px 24px;margin-bottom:32px}
table{width:100%;border-collapse:collapse;border:1px solid var(--linha)}th,td{padding:16px;text-align:left;border-bottom:1px solid var(--linha)}td:last-child,th:last-child{text-align:right}
.pagto{background:#efecf4;padding:24px;margin:28px 0}.pagto .metodo{padding:10px 0;font-size:20px}.pagto .campos{background:#e0dbea;padding:20px;margin:12px 0;display:grid;grid-template-columns:1fr 1fr;gap:16px}.pagto .campos div:first-child{grid-column:1/-1}.pagto input[type=radio],.form input[type=checkbox]{width:auto;margin-right:10px}
.erro{background:#fdecec;border:1px solid #c33;padding:14px 20px;margin-bottom:24px}
#veu{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#gaveta{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:21;display:flex;flex-direction:column;padding:24px;animation:entra .25s ease}
@keyframes entra{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#gaveta header{display:flex;justify-content:space-between;font-size:24px;margin-bottom:20px}#gaveta header button{background:none;border:0;font-size:28px;cursor:pointer}
.lista{flex:1;overflow:auto}.item{display:grid;grid-template-columns:70px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--linha);font-size:15px}.item img{width:70px}.item .mais{display:flex;gap:8px;align-items:center;margin-top:8px}.item .mais button{width:30px;height:30px;border:1px solid #bbb;background:#fff;cursor:pointer}
.pe{border-top:1px solid var(--linha);padding-top:16px}.pe .sub{display:flex;justify-content:space-between;font-size:22px;font-weight:600;margin-bottom:14px}.pe .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.resumo{display:flex;gap:40px;flex-wrap:wrap;margin:28px 0}.resumo b{display:block;font-size:22px}.dois{display:grid;grid-template-columns:1fr 1fr;gap:32px}.caixa{border:1px solid var(--linha);padding:20px}
.rodape{display:grid;grid-template-columns:2fr 1fr 1fr;gap:24px;padding-top:96px;padding-bottom:32px}.rodape .links a{display:block;margin-bottom:14px;text-decoration:none}.rodape .copy{grid-column:1/-1;font-size:15px;margin-top:48px}
@media(max-width:800px){.grade,.tres,.produto,.form,.dois,.rodape{grid-template-columns:1fr}.topo{height:auto;padding:20px 24px;flex-wrap:wrap;gap:12px}nav{gap:14px;font-size:16px;flex-wrap:wrap}.estreito h1{font-size:40px}}
/* Entrada suave das seções (igual ao WordPress) */
.topo,#app>*,.rodape{animation:byteonFade .8s ease both}
@keyframes byteonFade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid #2a7ab8;outline-offset:2px}

.topo,.rodape{max-width:none;padding-left:var(--lado);padding-right:var(--lado)}

.menu{display:contents}
@media(max-width:800px){
body{font-size:17px}
.topo{padding-top:12px;padding-bottom:4px;gap:0 10px}
nav{display:contents}
.logo{order:1;margin-right:auto;font-size:24px}
#btn-carrinho{order:2;padding:8px}.avatar{order:3;margin-left:0}
.menu{order:4;flex:0 0 100%;display:flex;justify-content:space-between;border-top:1px solid var(--linha);margin-top:6px}
.menu a{padding:12px 2px;font-size:16px}
.heroi{padding:56px 20px}.heroi p{font-size:19px;margin-bottom:28px}
.secao{padding:40px 20px}.secao h2{font-size:28px}
.centro p{font-size:18px}.tres{gap:24px}.dep{padding:4px 18px}
.sel.bola{width:64px;height:64px;font-size:14px}
.largo{padding-top:16px;padding-bottom:16px}.largo>h1{font-size:44px!important}.largo>p{font-size:18px!important}
.barra span{font-size:18px!important}.barra select{width:100%}
#vitrine{grid-template-columns:1fr 1fr;gap:24px 14px}
#vitrine .card h3{font-size:15px;margin:10px 0 4px}#vitrine .preco{font-size:14px;margin-bottom:10px}
#vitrine .btn{width:100%;padding:11px 8px;font-size:14px}#vitrine .sel{font-size:12px;padding:3px 8px;top:4px;right:4px}
.produto{gap:20px}.produto h1{font-size:28px!important}.produto .preco{font-size:22px}.qtd .btn{flex:1;text-align:center}
.estreito{padding:32px 20px}.estreito h1{font-size:36px}
.form{gap:16px}.form label{font-size:17px}.form h2{font-size:26px}
input[type=radio],input[type=checkbox]{width:auto;margin-right:10px}
th,td{padding:10px 8px;font-size:15px}
.pagto{padding:16px}.pagto .metodo{font-size:17px}.pagto .campos{grid-template-columns:1fr}
.pagto .btn{width:100%}.aviso{padding:14px 16px;font-size:16px}
.pe .dupla .btn{text-align:center;padding:14px 8px;font-size:15px}
.rodape{padding-top:48px}
}

</style>
</head>

const PAGINAS={"atendimento": {"titulo": "Atendimento", "html": "<p>Fale com a ByteOn pelo canal que for mais fácil para você.</p>\n\n\n\n<p>WhatsApp: (31) 99999-0000<br>E-mail: <a href=\"mailto:atendimento@byteon.com.br\">atendimento@byteon.com.br</a><br>Telefone: (31) 3333-0000<br>Instagram: @byteon.tech<br>Chat online: disponível durante o horário de atendimento.</p>\n\n\n\n<p>Horário de atendimento: segunda a sexta, das 8h às 18h, e sábado, das 9h às 13h.</p>\n\n\n\n<p>Endereço (loja fictícia): Av. Tecnologia, 1000, Sala 12, Belo Horizonte, MG, CEP 30110-000.</p>\n\n\n\n<p>Perguntas frequentes:<br>Quanto tempo leva a entrega? A entrega padrão leva de 5 a 8 dias úteis e a expressa de 2 a 3 dias úteis, contados após a aprovação do pagamento.<br>Como acompanho meu pedido? Acesse Minha conta e clique em Pedidos.<br>Quais formas de pagamento vocês aceitam? PIX, boleto bancário e cartão de crédito em até 6x sem juros.</p>"}, "sobre": {"titulo": "Sobre a ByteOn", "html": "<p>A ByteOn nasceu com uma ideia simples: tecnologia boa não precisa ser cara nem complicada.</p>\n\n\n\n<p>Somos uma loja virtual de periféricos e acessórios de tecnologia para quem trabalha, estuda e joga: mouses, teclados, fones, hubs, suportes e carregadores selecionados pela qualidade e pelo preço justo.</p>\n\n\n\n<p>Nossos compromissos:</p>\n\n\n\n<ul>\n<li>Produtos testados, com descrição clara e especificações reais</li>\n\n\n\n<li>12 meses de garantia em tudo o que vendemos</li>\n\n\n\n<li>Entrega para todo o Brasil, com frete padrão ou expresso</li>\n\n\n\n<li>Atendimento rápido por WhatsApp, e-mail, telefone e redes sociais</li>\n\n\n\n<li>Trocas e devoluções de acordo com o Código de Defesa do Consumidor</li>\n</ul>\n\n\n\n<p>ByteOn Tecnologia LTDA<br>Av. Tecnologia, 1000, Sala 12, Belo Horizonte, MG, CEP 30110-000<br>(Loja fictícia criada para fins acadêmicos.)</p>\n\n\n\n<p></p>"}, "trocas": {"titulo": "Trocas e Devoluções", "html": "<p>Na ByteOn, sua satisfação vem em primeiro lugar. Veja como funcionam as trocas e devoluções, de acordo com o Código de Defesa do Consumidor.</p>\n\n\n\n<p>Direito de arrependimento: você pode desistir da compra em até 7 dias corridos após o recebimento do produto, sem precisar justificar, conforme o art. 49 do Código de Defesa do Consumidor. O valor pago, incluindo o frete, será reembolsado.</p>\n\n\n\n<p>Produto com defeito: você tem até 30 dias após o recebimento para reclamar de defeitos em produtos não duráveis e até 90 dias para produtos duráveis, como os nossos eletrônicos. Além disso, todos os produtos têm 12 meses de garantia contra defeitos de fabricação.</p>\n\n\n\n<p>Como solicitar:</p>\n\n\n\n<ol>\n<li>Entre em contato pelo e-mail <a href=\"mailto:atendimento@byteon.com.br\">atendimento@byteon.com.br</a> ou pelo WhatsApp (31) 99999-0000, informando o número do pedido.</li>\n\n\n\n<li>Enviaremos as instruções e o código de postagem reversa, sem custo para você.</li>\n\n\n\n<li>Embale o produto com todos os acessórios e a nota fiscal.</li>\n\n\n\n<li>Após recebermos e conferirmos o produto, o reembolso ou a troca é feito em até 10 dias úteis.</li>\n</ol>\n\n\n\n<p>Condições: o produto deve estar sem sinais de mau uso e, de preferência, na embalagem original.</p>"}, "privacidade": {"titulo": "Segurança e Privacidade", "html": "<p>A ByteOn trata a segurança dos seus dados e da sua compra com seriedade.</p>\n\n\n\n<p>Compra segura: o site utiliza conexão criptografada (HTTPS/SSL) em todas as etapas, do cadastro ao pagamento. Os dados do cartão de crédito são processados por parceiros de pagamento certificados e não ficam armazenados em nossos servidores.</p>\n\n\n\n<p>Dados que coletamos: nome, CPF, e-mail, telefone e endereço de entrega, apenas para processar seu pedido, emitir a nota fiscal e entrar em contato sobre sua compra.</p>\n\n\n\n<p>Como usamos seus dados: para processar pedidos, calcular o frete, enviar o e-mail de confirmação e atender você. Não vendemos nem compartilhamos suas informações com terceiros, exceto transportadoras e meios de pagamento, quando necessário para concluir a entrega e a cobrança.</p>\n\n\n\n<p>Seus direitos (LGPD): conforme a Lei Geral de Proteção de Dados (Lei nº 13.709/2018), você pode solicitar acesso, correção ou exclusão dos seus dados a qualquer momento pelo e-mail <a href=\"mailto:privacidade@byteon.com.br\">privacidade@byteon.com.br</a>.</p>\n\n\n\n<p>Cookies: usamos cookies para manter seu carrinho e melhorar a navegação. Você pode desativá-los nas configurações do seu navegador.</p>\n\n\n\n<p>Formas de pagamento: PIX, boleto bancário e cartão de crédito em até 6x sem juros. O pedido só é enviado após a confirmação do pagamento.</p>"}};

<script>
const $=s=>document.querySelector(s), R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

const gravar=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let carrinho=ler('byteon_carrinho',[]);
const prod=id=>PRODUTOS.find(p=>p.id===id);
const salvar=()=>{gravar('byteon_carrinho',carrinho);const n=carrinho.reduce((a,i)=>a+i.q,0),b=$('#badge');b.textContent=n;b.hidden=!n};
function adicionar(id,q=1){const i=carrinho.find(x=>x.id===id);i?i.q+=q:carrinho.push({id,q});salvar();gaveta()}
const subtotal=()=>carrinho.reduce((a,i)=>a+prod(i.id).por*i.q,0);
const cartao=p=>`<article class="card"><a class="foto" href="#/produto/${p.id}"><img src="${p.img}" alt="${p.nome}" loading="lazy"><span class="sel">Oferta</span></a><h3><a href="#/produto/${p.id}">${p.nome}</a></h3><div class="preco"><s>${R(p.de)}</s> ${R(p.por)}</div><button class="btn" data-add="${p.id}">Adicionar ao carrinho</button></article>`;
const mini=p=>cartao(p).replace('class="sel"','class="sel bola"').replace('>Oferta<','>Oferta!<');
function gaveta(){
  $('#veu').hidden=$('#gaveta').hidden=false;
  const n=carrinho.reduce((a,i)=>a+i.q,0);

  <h2 style="margin-top:40px">Seu pedido</h2><table><tr><th>Produto</th><th>Subtotal</th></tr>${carrinho.map(i=>`<tr><td>${prod(i.id).nome} × ${i.q}</td><td>${R(prod(i.id).por*i.q)}</td></tr>`).join('')}<tr><th>Subtotal</th><th>${R(subtotal())}</th></tr><tr><th>Envio</th><td><label><input type="radio" name="frete" value="19.9" checked> Padrão: R$ 19,90</label><br><label><input type="radio" name="frete" value="34.9"> Expressa: R$ 34,90</label></td></tr><tr><th>Total</th><th id="total"></th></tr></table>
  <div class="pagto"><div class="metodo"><label><input type="radio" name="pg" value="Cartão de crédito (até 6x sem juros)" checked> Cartão de crédito (até 6x sem juros)</label></div><p class="pdesc" data-pg="Cartão">Pague com segurança. Seus dados são protegidos por criptografia SSL.</p><div class="campos" id="campos-cartao"><div><label for="num">Número do cartão <span class="req">*</span></label><input id="num" inputmode="numeric" placeholder="Pagamento simulado, use qualquer número"></div><div><label for="val">Validade (MM/AA) <span class="req">*</span></label><input id="val" placeholder="MM/YY"></div><div><label for="cvc">Card code (CVC) <span class="req">*</span></label><input id="cvc"></div></div><div class="metodo"><label><input type="radio" name="pg" value="PIX"> PIX</label></div><p class="pdesc" data-pg="PIX" hidden>Pague com PIX e tenha aprovação imediata. Após finalizar o pedido, use a chave abaixo.</p><div class="metodo"><label><input type="radio" name="pg" value="Boleto bancário"> Boleto bancário</label></div><p class="pdesc" data-pg="Boleto" hidden>O boleto será enviado ao seu e-mail e vence em 3 dias úteis. Pedido enviado após a compensação.</p><hr><p>Os seus dados pessoais serão utilizados para processar a sua compra, apoiar a sua experiência em todo este site e para outros fins descritos na nossa <a href="#/privacidade">política de privacidade</a>.</p><p><label><input type="checkbox" id="termos"> Li e concordo com o(s) <a href="#/trocas">termos e condições</a> do site <span class="req">*</span></label></p><div style="text-align:right"><button class="btn quad" type="submit">Finalizar pedido</button></div></div></form></div>`},

function ir(){const [,r='',a]=(location.hash||'#/').split('/');fechar();$('#app').innerHTML=(rotas[r]||rotas[''])(a);window.scrollTo(0,0);

   document.querySelectorAll('input[name=pg]').forEach(x=>x.onchange=()=>{const k=document.querySelector('input[name=pg]:checked').value.split(' ')[0];$('#campos-cartao').hidden=k!=='Cartão';document.querySelectorAll('.pdesc').forEach(p=>p.hidden=p.dataset.pg!==k)})}
  const o=$('#ordem');if(o)o.onchange=()=>{const l=[...PRODUTOS];if(o.value==='m')l.sort((a,b)=>a.por-b.por);if(o.value==='M')l.sort((a,b)=>b.por-a.por);$('#vitrine').innerHTML=l.map(cartao).join('')}}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.add)adicionar(t.dataset.add);
  if(t.dataset.addq)adicionar(t.dataset.addq,Math.max(1,parseInt($('#qtd').value)||1));
  if(t.dataset.q){const i=carrinho.find(x=>x.id===t.dataset.q);i.q+=+t.dataset.d;if(i.q<1)carrinho=carrinho.filter(x=>x!==i);salvar();gaveta()}
  if(t.dataset.rm){carrinho=carrinho.filter(x=>x.id!==t.dataset.rm);salvar();gaveta()}
  if(t.id==='btn-carrinho')gaveta();
  if(t.id==='cupom-a'){e.preventDefault();$('#cupom-c').hidden=false}
  if(t.id==='cupom-ok')$('#cupom-msg').textContent=$('#cupom').value.trim()?`Cupom "${$('#cupom').value.trim()}" não existe!`:'Digite o código do cupom.';
  if(t.dataset.fechar!==undefined||t.id==='veu')fechar()});
$('#veu').onclick=fechar;
document.addEventListener('submit',e=>{if(e.target.id!=='pedido')return;e.preventDefault();
  const v=i=>$('#'+i).value.trim(),pg=document.querySelector('input[name=pg]:checked').value,card=pg.indexOf('Cartão')===0;
